name: Deploy to Google Cloud Run

on:
  # Manual trigger only — requires explicit user approval in GitHub Actions before running
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm production deployment to Cloud Run'
        required: true
        default: 'CANCEL'

env:
  PROJECT_ID: gen-lang-client-0483853938
  SERVICE_NAME: new-bhama-fashions-erp
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify Deployment Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "❌ Deployment aborted: confirmation phrase did not match 'DEPLOY'."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation or Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          # Preferred: Workload Identity Federation (keyless, zero credential leakage risk)
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Fallback: Service Account JSON key if WIF is not configured
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/erp-containers/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/erp-containers/${{ env.SERVICE_NAME }}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/erp-containers/${{ env.SERVICE_NAME }}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/erp-containers/${{ env.SERVICE_NAME }}:latest" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 1 \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "NODE_ENV=production,GCS_BUCKET=${{ secrets.GCS_BUCKET }}"
