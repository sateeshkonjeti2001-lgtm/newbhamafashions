name: Deploy to Cloudflare Workers

on:
  # Manual trigger only — never auto-deploys on push until verified
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm manual production deployment to Cloudflare'
        required: true
        default: 'CANCEL'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify Manual DEPLOY Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "Deployment aborted: confirm_deploy input did not match 'DEPLOY'."
            exit 1
          fi

      - name: Validate Required Cloudflare & App Secrets
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' }}
          HAS_SESSION_SECRET: ${{ secrets.SESSION_SECRET != '' }}
        run: |
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "Error: Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if [ "$HAS_CF_ACCOUNT" != "true" ]; then
            echo "Error: Missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi
          if [ "$HAS_AUTH_SECRET" != "true" ]; then
            echo "Error: Missing AUTH_SECRET secret (min 16 random chars)."
            exit 1
          fi
          if [ "$HAS_SESSION_SECRET" != "true" ]; then
            echo "Error: Missing SESSION_SECRET secret (min 16 random chars)."
            exit 1
          fi
          echo "All required Cloudflare deployment secrets present."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Code Check
        run: npm run lint

      - name: Build Frontend Static Assets for Cloudflare
        run: npx vite build

      - name: Configure D1 Database Binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${D1_DATABASE_ID}/g" wrangler.jsonc
            echo "Applied D1_DATABASE_ID from GitHub Secret."
          elif grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.jsonc; then
            echo "Error: Set D1_DATABASE_ID in GitHub Secrets OR replace REPLACE_WITH_YOUR_D1_DATABASE_ID in wrangler.jsonc."
            echo "Create database with: npx wrangler d1 create new-bhama-fashions-erp-db"
            exit 1
          else
            echo "Using D1 database_id configured in wrangler.jsonc."
          fi

      - name: Apply Cloudflare D1 Schema Migrations (Safe & Idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply new-bhama-fashions-erp-db --remote

      - name: Sync Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENTRY_PIN_HASH: ${{ secrets.ENTRY_PIN_HASH }}
        run: |
          printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          if [ -n "$ENTRY_PIN_HASH" ]; then
            printf '%s' "$ENTRY_PIN_HASH" | npx wrangler secret put ENTRY_PIN_HASH
          fi

      - name: Deploy Worker & Static Assets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
